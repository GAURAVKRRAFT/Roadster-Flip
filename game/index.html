<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140a33">
<title>Roadster Flip</title>
<link rel="stylesheet" href="css/game.css">
</head><body>
<div id="ld"><div class="sun"></div><div class="grid"></div><div class="lc"><div class="t1">ROADSTER</div><div class="t2">FLIP</div>
<svg class="car" viewBox="-30 -12 60 40"><path class="fl" fill="#7fe8ff" d="M-17 9h8l-4 14zM9 9h8l-4 14z"/><path fill="#b7a6ca" d="M-23 4L-23-1L-15-4L-7-8L6-8L15-3L23-1L23 4Z"/><path fill="#35255a" d="M-14-3.5L-6-7L5-7L12-3.5Z"/><rect x="-24" y="-1" width="2" height="4" fill="#ff2d4a"/><rect x="21" y="-1" width="3" height="2" fill="#fff6c0"/><circle cx="-13" cy="5" r="4.5" fill="#15101f" stroke="#d7d0e6" stroke-width="1.6"/><circle cx="13" cy="5" r="4.5" fill="#15101f" stroke="#d7d0e6" stroke-width="1.6"/></svg>

<script src="js/game.js"></script>
